      timer: {base: "https://www.google.co.uk/search?q=12.5%20minute%20timer", query: "https://www.google.co.uk/search?q={q}%20timer"},
      tm: {base: "https://www.themoviedb.org/", query: "https://www.themoviedb.org/search?query={q}"},
      tmc: {base: "https://login.themilesconsultancy.com/Driver/TripSummary.aspx"},
      tmt: {base: "https://www.themoviedb.org/", query: "https://www.themoviedb.org/search/tv?query={q}"},
      todo: {base: "https://todo.minskio.co.uk/"},
      tr: {base: "https://translate.google.com/", query: "https://translate.google.com/?sl=auto&tl=en&text={q}"},
      track: {base: "https://www.royalmail.com/track-your-item", query: "https://www.royalmail.com/track-your-item#/tracking-results/{q}"},
      tv: {base: "https://www.thetvdb.com/", query: "https://www.thetvdb.com/search?query={q}"},
      tvt: {base: "https://tvtropes.org/", query: "https://tvtropes.org/pmwiki/search_result.php?q={q}"},
      ud: {base: "https://www.urbandictionary.com/", query: "https://www.urbandictionary.com/define.php?term={q}"},
      ujs: {base: "https://greasyfork.org/en/scripts", query: "https://greasyfork.org/en/scripts?q={q}"},
      valid: {base: "https://validator.w3.org/nu/", query: "https://validator.w3.org/nu/?doc={q}"},
      w3c: {base: "https://validator.w3.org/", query: "https://validator.w3.org/nu/?doc={q}"},
      w3w: {base: "https://what3words.com/",query: "https://what3words.com/{q}"},
      w: {base: "https://en.wikipedia.org/w/index.php", query: "https://en.wikipedia.org/w/index.php?title=Special:Search&search={q}"},
      wa: {base: "https://www.wolframalpha.com/", query: "https://www.wolframalpha.com/input/?i={q}"},
      whois: {base: "https://whois.gandi.net/", query: "https://whois.gandi.net/en/results?search={q}"},
      wikt: {base: "https://en.wiktionary.org/w/index.php", query: "https://en.wiktionary.org/w/index.php?title=Special:Search&search={q}"},
      wiktno: {base: "https://no.wiktionary.org/w/index.php", query: "https://no.wiktionary.org/w/index.php?title=Special:Search&search={q}"},
      wine: {base: "https://www.winehq.org/",query: "https://www.winehq.org/search?q={q}"},
      wno: {base: "https://no.wikipedia.org/w/index.php",query: "https://no.wikipedia.org/w/index.php?title=Special:Search&search={q}"},
      y: {base: "https://www.youtube.com/",query: "https://www.youtube.com/results?search_query={q}"}
      };

      const input = document.getElementById("queryInput");
      const bookmarkList = document.getElementById("bookmarkList");
      const predictionDisplay = document.getElementById("prediction");

      let filteredBookmarks = [...bookmarks];
      let selectedBookmarkIndex = -1;

      function renderBookmarks() {
      bookmarkList.innerHTML = "";
      filteredBookmarks.forEach((bm, index) => {
      const li = document.createElement("li");
      li.textContent = bm.name;
      if (index === selectedBookmarkIndex) {
        li.classList.add("highlight");
        // Scroll the selected item into view
        setTimeout(() => li.scrollIntoView({ block: "nearest", behavior: "smooth" }), 0);
      }
      li.addEventListener("click", () => {
        window.open(bm.url, "_self");
      });
      bookmarkList.appendChild(li);
      });

      bookmarkList.style.display = filteredBookmarks.length === 0 ? "none" : "block";
      }

      function filterBookmarks(query) {
        selectedBookmarkIndex = -1;
        const lower = query.toLowerCase();
        filteredBookmarks = lower === ""
          ? [...bookmarks]
          : bookmarks.filter(b => b.name.toLowerCase().includes(lower));
        renderBookmarks();
      }

      function runCommand(prefix, args) {
        const cmd = commandMap[prefix];
        if (!cmd) return;
        const url = args.length === 0
          ? cmd.base
          : cmd.query.replace("{q}", encodeURIComponent(args.join(" ")));
        window.open(url, "_self");
      }

      function hintCommand(prefix, args) {
        const cmd = commandMap[prefix];
        if (!cmd) return "";
        return args.length === 0
          ? cmd.base
          : cmd.query.replace("{q}", encodeURIComponent(args.join(" ")));
      }

      function handleCommand(inputValue) {
        const parts = inputValue.trim().split(" ");
        const prefix = parts[0].toLowerCase();
        const args = parts.slice(1);

        if (commandMap[prefix]) {
          runCommand(prefix, args);
        } else {
          const query = encodeURIComponent(inputValue);
          window.open(`https://www.google.com/search?q=${query}`, "_self");
        }
      }

      function updatePrediction(inputValue) {
        const [prefix, ...args] = inputValue.trim().split(" ");
        predictionDisplay.textContent = commandMap[prefix?.toLowerCase()]
          ? hintCommand(prefix.toLowerCase(), args)
          : "";
        }

      function normalizeInput(raw) {
        const spaceIndex = raw.indexOf(" ");
        if (spaceIndex === -1) return raw.replace(/'/g, "");
        return raw.slice(0, spaceIndex).replace(/'/g, "") + raw.slice(spaceIndex);
      }

      input.addEventListener("input", (e) => {
        const value = normalizeInput(e.target.value);
        filterBookmarks(value);
        updatePrediction(value);
      });

      input.addEventListener("keydown", (e) => {
      if (e.key === "Tab") {
      e.preventDefault();
      if (filteredBookmarks.length > 0) {
      if (e.shiftKey) {
        selectedBookmarkIndex = (selectedBookmarkIndex - 1 + filteredBookmarks.length) % filteredBookmarks.length;
      } else {
        selectedBookmarkIndex = (selectedBookmarkIndex + 1) % filteredBookmarks.length;
      }
      renderBookmarks();
      }
      }
      else if (e.key === "ArrowDown") {
          e.preventDefault();
          if (filteredBookmarks.length > 0) {
            selectedBookmarkIndex = (selectedBookmarkIndex + 1) % filteredBookmarks.length;
            renderBookmarks();
          }
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          if (filteredBookmarks.length > 0) {
            selectedBookmarkIndex = (selectedBookmarkIndex - 1 + filteredBookmarks.length) % filteredBookmarks.length;
            renderBookmarks();
          }
        } else if (e.key === "Enter") {
          if (selectedBookmarkIndex >= 0) {
            window.open(filteredBookmarks[selectedBookmarkIndex].url, "_self");
          } else {
            handleCommand(normalizeInput(input.value));
          }
        } else if (e.key === "Escape") {
          input.value = "";
          predictionDisplay.textContent = "";
          filterBookmarks("");
        }
      });

      // Initial load
      filterBookmarks("");
      function formatDateTime(date) {
      const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
      const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

      const dayName = days[date.getDay()];
      const day = date.getDate();
      const month = months[date.getMonth()];
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');

      const getOrdinal = (n) => {
      if (n > 3 && n < 21) return "th";
      switch (n % 10) {
      case 1: return "st";
      case 2: return "nd";
      case 3: return "rd";
      default: return "th";
      }
      };

      return `${dayName} ${day}${getOrdinal(day)} ${month}, ${hours}:${minutes}`;
      }

      function updateDateTime() {
      const now = new Date();
      document.getElementById("datetime-text").textContent = formatDateTime(now);
      }

      setInterval(updateDateTime, 60000);
      updateDateTime();

    </script>
  </body>
